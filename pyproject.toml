[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "py_coltrims"
version = "0.1.0"
description = "A package to calculate momenta from a COLTRIMS experiment"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "numba",
]

[project.optional-dependencies]
notebook = ["ipympl"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/McGinnis-Atom/py_coltrims"

[tool.setuptools.packages.find]
where = ["src"]
